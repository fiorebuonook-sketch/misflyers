.bar{position:sticky;top:0;z-index:5;background:var(--cream);border-bottom:1px solid var(--gold2);padding:12px 16px}
.wrap{max-width:1100px;margin:0 auto}
.search{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--gold2);border-radius:12px;padding:0 14px;height:48px}

.sep{flex:none;width:1px;background:var(--gold2);margin:4px 2px}
.count{padding:14px 16px 4px;font-size:14px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding:8px 16px 32px}

.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(10,52,38,.08),0 4px 14px rgba(10,52,38,.06);cursor:pointer;text-align:left;border:0;font:inherit;color:inherit;display:flex;flex-direction:column;transition:transform .15s}

.card:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.thumb{aspect-ratio:853/1600;overflow:hidden;background:#eee6da;position:relative}

.btn[hidden]{display:none}
.btn.wab{background:#fff;color:var(--gd)}

.cw{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:10px;border:1.5px solid var(--g);background:var(--g);color:#fff;font:inherit;font-weight:700;font-size:13px;padding:8px 6px;border-radius:9px;cursor:pointer}

.card{cursor:pointer}
.msg{color:#fff;font-size:14px;min-height:20px;text-align:center}
.x{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:26px;cursor:pointer}

$('#dl').hidden=false;
const blobs={};
const getFile=async x=>{if(!blobs[x.id])blobs[x.id]=fetch(x.id+'.jpg').then(r=>{if(!r.ok)throw 0;return r.blob()}).then(b=>new File([b],'Flyer_'+x.id+'.jpg',{type:'image/jpeg'}));return blobs[x.id]};
const ficha=x=>'https://veltripropiedades.com.ar/p/'+x.id.replace('KP','')+'?fw_uid=10765';
const texto=x=>x.titulo+' en '+x.op.toLowerCase()+' · '+x.precio+'\n'+x.dir+' · '+x.zona+'\n'+x.id+' · Veltri Propiedades\n'+ficha(x);
const mobile=/Android|iPhone|iPad/i.test(navigator.userAgent);
async function sendWA(x,m){
  try{const f=await getFile(x);
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text:texto(x)});if(m)m.textContent='';return}
    const u=URL.createObjectURL(f);const a=document.createElement('a');a.href=u;a.download=f.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
    window.open('https://wa.me/?text='+encodeURIComponent(texto(x)),'_blank');
    if(m)m.textContent='Se descargó el flyer: adjuntalo en el chat de WhatsApp que se abrió.'}
  catch(e){if(m)m.textContent=(e&&e.name==='AbortError')?'':'No se pudo compartir. Descargá el flyer y compartilo desde la galería del celular.'}}
$('#wab').onclick=()=>{if(cur)sendWA(cur,$('#msg'))};
$('#dl').onclick=async()=>{if(!cur)return;const m=$('#msg');m.textContent='Preparando…';
  try{const b=await fetch(cur.id+'.jpg').then(r=>{if(!r.ok)throw 0;return r.blob()});
    const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='Flyer_'+cur.id+'.jpg';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);m.textContent='Listo, flyer descargado.'}
  catch(e){m.textContent=(e&&e.name==='AbortError')?'':'Si no se descargó, mantené apretada la imagen para guardarla.'}};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
